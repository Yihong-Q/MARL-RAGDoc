[tool.poetry]
name = "marl-ragdoc"
version = "0.1.0"
description = "Reference implementation of the MARL-RAGDoc hierarchical retrieval framework."
authors = ["Cursor Agent <agent@example.com>"]
readme = "README.md"
packages = [{ include = "marl_ragdoc", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.2.0"
transformers = "^4.43.0"
sentencepiece = "^0.1.99"
numpy = "^1.26.0"
scipy = "^1.11.0"
Pillow = "^10.0.0"
pdfplumber = "^0.11.0"
opencv-python = "^4.8.0"
einops = "^0.7.0"
requests = "^2.32.0"

[tool.poetry.group.dev.dependencies]
black = "^24.0"
ruff = "^0.5.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

